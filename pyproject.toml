[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-learning-lab"
version = "0.1.0"
description = "A small, dependency-free project for learning vLLM serving concepts"
requires-python = ">=3.10"

[project.scripts]
vllm-lab = "vllm_learning_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
